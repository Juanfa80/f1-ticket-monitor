name: Monitor F1 ticket

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: Send a Telegram test without checking ticket prices
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: f1-ticket-monitor
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get monitor files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies and verify Chrome
        run: |
          python -m pip install -r requirements.txt
          google-chrome --version
          command -v xvfb-run
      - name: Check ticket and send alerts
        env:
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: xvfb-run -a python monitor.py
      - name: Save alert deduplication state
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- state/last_alert.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/last_alert.json
            git commit -m "Update F1 monitor alert state"
            git push
          fi
